services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ikan
      POSTGRES_PASSWORD: ikan
      POSTGRES_DB: kalkulator_ikan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  pgdata:
